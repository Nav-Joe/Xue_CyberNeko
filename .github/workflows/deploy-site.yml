# 把 site/ 宣传站发布到 GitHub Pages。
# 仓库 Settings → Pages → Source 选「GitHub Actions」后，推 main 或手动跑本工作流即可。
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/stage-site-assets.mjs'
      - 'scripts/download-sample-model.js'
      - 'scripts/ensure-cubism-core.js'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stage Live2D demo assets
        run: node scripts/stage-site-assets.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
